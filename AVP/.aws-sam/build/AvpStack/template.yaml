AWSTemplateFormatVersion: '2010-09-09'
Description: Nested Stack for Amazon Verified Permissions (AVP) resources
Parameters:
  CognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool
  CognitoClientId:
    Type: String
    Description: Cognito User Pool Client ID
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID
Resources:
  MyPolicyStore:
    Type: AWS::VerifiedPermissions::PolicyStore
    Properties:
      Description: Policy store for the Recube::MyApp application
      ValidationSettings:
        Mode: STRICT
      Schema:
        CedarJson:
          Fn::Sub: "{\n  \"Recube::MyApp\": {\n    \"entityTypes\": {\n      \"User\"\
            : { \"memberOfTypes\": [\"Roles\"] },\n      \"Roles\": {},\n      \"\
            Bike\": {},\n      \"Car\": {}\n    },\n    \"actions\": {\n      \"get\
            \ /bikes\": {\n        \"appliesTo\": { \"principalTypes\": [\"User\"\
            ,\"Roles\"], \"resourceTypes\": [\"Bike\"] }\n      },\n      \"post /bikes\"\
            : {\n        \"appliesTo\": { \"principalTypes\": [\"User\",\"Roles\"\
            ], \"resourceTypes\": [\"Bike\"] }\n      },\n      \"get /cars\": {\n\
            \        \"appliesTo\": { \"principalTypes\": [\"User\",\"Roles\"], \"\
            resourceTypes\": [\"Car\"] }\n      },\n      \"post /cars\": {\n    \
            \    \"appliesTo\": { \"principalTypes\": [\"User\",\"Roles\"], \"resourceTypes\"\
            : [\"Car\"] }\n      },\n      \"get /bike/{bikeId}\": {\n        \"appliesTo\"\
            : { \"principalTypes\": [\"User\",\"Roles\"], \"resourceTypes\": [\"Bike\"\
            ] }\n      },\n      \"put /bike/{bikeId}\": {\n        \"appliesTo\"\
            : { \"principalTypes\": [\"User\",\"Roles\"], \"resourceTypes\": [\"Bike\"\
            ] }\n      },\n      \"delete /bike/{bikeId}\": {\n        \"appliesTo\"\
            : { \"principalTypes\": [\"User\",\"Roles\"], \"resourceTypes\": [\"Bike\"\
            ] }\n      },\n      \"get /car/{carId}\": {\n        \"appliesTo\": {\
            \ \"principalTypes\": [\"User\",\"Roles\"], \"resourceTypes\": [\"Car\"\
            ] }\n      },\n      \"put /car/{carId}\": {\n        \"appliesTo\": {\
            \ \"principalTypes\": [\"User\",\"Roles\"], \"resourceTypes\": [\"Car\"\
            ] }\n      },\n      \"delete /car/{carId}\": {\n        \"appliesTo\"\
            : { \"principalTypes\": [\"User\",\"Roles\"], \"resourceTypes\": [\"Car\"\
            ] }\n      }\n    }\n  }\n}\n"
  ViewersPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId:
        Ref: MyPolicyStore
      Definition:
        Static:
          Description: Allow Viewers to getBike and getCars
          Statement:
            Fn::Sub: "permit (\n    principal in Recube::MyApp::Roles::\"${CognitoUserPoolId}|viewers\"\
              ,\n    action in [\n        Recube::MyApp::Action::\"get /bikes\",\n\
              \        Recube::MyApp::Action::\"get /bike/{bikeId}\",\n        Recube::MyApp::Action::\"\
              get /cars\",\n        Recube::MyApp::Action::\"get /car/{carId}\"\n\
              \    ],\n    resource\n);\n"
  AdminsPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId:
        Ref: MyPolicyStore
      Definition:
        Static:
          Description: Allow Admins to perform all actions
          Statement:
            Fn::Sub: "permit (\n    principal in Recube::MyApp::Roles::\"${CognitoUserPoolId}|admins\"\
              ,\n    action,\n    resource\n);\n"
  IdentitySource:
    Type: AWS::VerifiedPermissions::IdentitySource
    Properties:
      PolicyStoreId:
        Ref: MyPolicyStore
      Configuration:
        CognitoUserPoolConfiguration:
          UserPoolArn:
            Ref: CognitoUserPoolArn
          ClientIds:
          - Ref: CognitoClientId
          GroupConfiguration:
            GroupEntityType: Recube::MyApp::Roles
      PrincipalEntityType: Recube::MyApp::User
Outputs:
  PolicyStoreId:
    Description: The ID of the AVP Policy Store
    Value:
      Fn::GetAtt:
      - MyPolicyStore
      - PolicyStoreId
  PolicyStoreArn:
    Description: The ARN of the AVP Policy Store
    Value:
      Fn::GetAtt:
      - MyPolicyStore
      - Arn
