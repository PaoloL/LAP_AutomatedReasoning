AWSTemplateFormatVersion: '2010-09-09'
Description: Nested Stack for Amazon Verified Permissions (AVP) resources
Parameters:
  CognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool
  CognitoClientId:
    Type: String
    Description: Cognito User Pool Client ID
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID
Resources:
  MyPolicyStore:
    Type: AWS::VerifiedPermissions::PolicyStore
    Properties:
      Description: Policy store for the Recube::MyApp application
      ValidationSettings:
        Mode: STRICT
      Schema:
        CedarJson:
          Fn::Sub: "{\n  \"Recube::MyApp\": {\n    \"entityTypes\": {\n      \"User\"\
            : { \"memberOfTypes\": [\"Roles\"] },\n      \"Roles\": {},\n      \"\
            Bike\": {},\n      \"Car\": {}\n    },\n    \"actions\": {\n      \"getAllBikes\"\
            : {\n        \"appliesTo\": { \"principalTypes\": [\"User\",\"Roles\"\
            ], \"resourceTypes\": [\"Bike\"] }\n      },\n      \"createBike\": {\n\
            \        \"appliesTo\": { \"principalTypes\": [\"User\",\"Roles\"], \"\
            resourceTypes\": [\"Bike\"] }\n      },\n      \"getBike\": {\n      \
            \  \"appliesTo\": { \"principalTypes\": [\"User\",\"Roles\"], \"resourceTypes\"\
            : [\"Bike\"] }\n      },\n      \"updateBike\": {\n        \"appliesTo\"\
            : { \"principalTypes\": [\"User\",\"Roles\"], \"resourceTypes\": [\"Bike\"\
            ] }\n      },\n      \"deleteBike\": {\n        \"appliesTo\": { \"principalTypes\"\
            : [\"User\",\"Roles\"], \"resourceTypes\": [\"Bike\"] }\n      },\n  \
            \    \"getAllCars\": {\n        \"appliesTo\": { \"principalTypes\": [\"\
            User\",\"Roles\"], \"resourceTypes\": [\"Car\"] }\n      },\n      \"\
            createCar\": {\n        \"appliesTo\": { \"principalTypes\": [\"User\"\
            ,\"Roles\"], \"resourceTypes\": [\"Car\"] }\n      },\n      \"getCar\"\
            : {\n        \"appliesTo\": { \"principalTypes\": [\"User\",\"Roles\"\
            ], \"resourceTypes\": [\"Car\"] }\n      },\n      \"updateCar\": {\n\
            \        \"appliesTo\": { \"principalTypes\": [\"User\",\"Roles\"], \"\
            resourceTypes\": [\"Car\"] }\n      },\n      \"deleteCar\": {\n     \
            \   \"appliesTo\": { \"principalTypes\": [\"User\",\"Roles\"], \"resourceTypes\"\
            : [\"Car\"] }\n      }\n    }\n  }\n}\n"
  ViewersPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId:
        Ref: MyPolicyStore
      Definition:
        Static:
          Description: Allow Viewers to getBike and getCars
          Statement:
            Fn::Sub: "permit (\n    principal in Recube::MyApp::Roles::\"${CognitoUserPoolId}|viewers\"\
              ,\n    action in [\n        Recube::MyApp::Action::\"getAllBikes\",\n\
              \        Recube::MyApp::Action::\"getBike\",\n        Recube::MyApp::Action::\"\
              getAllCars\",\n        Recube::MyApp::Action::\"getCar\"\n    ],\n \
              \   resource\n);\n"
  AdminsPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId:
        Ref: MyPolicyStore
      Definition:
        Static:
          Description: Allow Admins to perform all actions
          Statement:
            Fn::Sub: "permit (\n    principal in Recube::MyApp::Roles::\"${CognitoUserPoolId}|admins\"\
              ,\n    action,\n    resource\n);\n"
  IdentitySource:
    Type: AWS::VerifiedPermissions::IdentitySource
    Properties:
      PolicyStoreId:
        Ref: MyPolicyStore
      Configuration:
        CognitoUserPoolConfiguration:
          UserPoolArn:
            Ref: CognitoUserPoolArn
          ClientIds:
          - Ref: CognitoClientId
          GroupConfiguration:
            GroupEntityType: Recube::MyApp::Roles
      PrincipalEntityType: Recube::MyApp::User
Outputs:
  PolicyStoreId:
    Description: The ID of the AVP Policy Store
    Value:
      Fn::GetAtt:
      - MyPolicyStore
      - PolicyStoreId
  PolicyStoreArn:
    Description: The ARN of the AVP Policy Store
    Value:
      Fn::GetAtt:
      - MyPolicyStore
      - Arn
