AWSTemplateFormatVersion: '2010-09-09'
Description: 'Nested Stack for Cognito Resources. (Currently a placeholder - Add your
  Cognito resources here)

  '
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: AutomatedReasoningDemo
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
      - Name: email
        AttributeDataType: String
        Required: true
        Mutable: true
      - Name: name
        AttributeDataType: String
        Required: true
        Mutable: true
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName:
        Fn::Sub: AutomatedReasoningDemo-client
      UserPoolId:
        Ref: UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
      - COGNITO
  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      Description: Administrators group with full access
      UserPoolId:
        Ref: UserPool
  ViewersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: viewers
      Description: Viewers group with read-only access
      UserPoolId:
        Ref: UserPool
Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value:
      Ref: UserPool
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-UserPoolId
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value:
      Ref: UserPoolClient
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-UserPoolClientId
  UserPoolArn:
    Description: Cognito User Pool ARN
    Value:
      Fn::GetAtt:
      - UserPool
      - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-UserPoolArn
  AdminsGroupName:
    Description: Cognito User Pool Admins Group Name
    Value:
      Ref: AdminsGroup
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-AdminsGroupName
  ViewersGroupName:
    Description: Cognito User Pool Viewers Group Name
    Value:
      Ref: ViewersGroup
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ViewersGroupName
