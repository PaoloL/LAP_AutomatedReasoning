      - CallbackFunction
      - Arn
  AuthorizeFunctionArn:
    Description: Authorize Lambda Function ARN
    Value:
      Fn::GetAtt:
      - AuthorizeFunction
      - Arn
  FunctionIamRoleArn:
    Description: Implicit IAM Role created for function
    Value:
      Fn::GetAtt:
      - LambdaExecutionRole
      - Arn
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prd/
